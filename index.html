<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>QR Code Generator</h1>
        <p>Type a link to generate a QR code:</p>

        <input type="text" id="text" placeholder="https://example.com">
        <button id="btn">Generate QR Code</button>

        <img id="qr" alt="">
    </div>

    <script>
        const text  = document.getElementById("text");
        const btn = document.getElementById("btn");
        const qr = document.getElementById("qr");

        btn.addEventListener("click", function  (){
            const value = text.value.trim();
            if (value ===""){
                alert("Please enter some text or link first.");
                return;
            }
            qr.src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(value);
            qr.style.display = "block";
        });
    </script>
</body>
</html>
